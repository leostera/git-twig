name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Keep the binary's glibc baseline compatible with supported LTS hosts.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - shell: bash
        run: |
          python scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          cargo test --workspace --locked
          cargo build --release --locked -p git-twig --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p package dist
          cp target/${{ matrix.target }}/release/git-twig LICENSE README.md CHANGELOG.md crates/git-twig/man/git-twig.1 package/
          tar -czf dist/git-twig-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz -C package .
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/check-windows-binary.ps1 target/${{ matrix.target }}/release/git-twig.exe
          New-Item -ItemType Directory -Path package, dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/git-twig.exe, LICENSE, README.md, CHANGELOG.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/git-twig-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          python3 scripts/check-release-version.py "${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum *.tar.gz *.zip) > dist/SHA256SUMS
          python3 scripts/release-formula.py "${GITHUB_REF_NAME#v}" dist > dist/git-twig.rb
          python3 scripts/release-scoop.py "${GITHUB_REF_NAME#v}" dist > "$RUNNER_TEMP/git-twig.json"
          python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c "formula-${GITHUB_REF_NAME}" origin/main
          cp dist/git-twig.rb Formula/git-twig.rb
          mkdir -p bucket && cp "$RUNNER_TEMP/git-twig.json" bucket/git-twig.json
          git add Formula/git-twig.rb bucket/git-twig.json
          git commit -m "chore: update Homebrew formula and Scoop manifest for $GITHUB_REF_NAME"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
  npm:
    # One package carrying every platform's binary, published after the GitHub
    # release so it holds exactly the released archives' binaries.
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          version="${GITHUB_REF_NAME#v}"
          package=$(python3 scripts/npm-package.py "$version" --dist dist --out "$RUNNER_TEMP/npm")
          # A rerun after a successful publish must not fail the release.
          if npm view "git-twig@$version" version >/dev/null 2>&1; then
            echo "git-twig@$version is already on npm"
          else
            npm publish --provenance --access public "$package"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
