name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  benchmark-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --cwd bench --frozen-lockfile
      - run: bun run --cwd bench format:check
      - run: bun run --cwd bench typecheck
      - run: bun test bench/tests
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s bench -p 'test_*.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 bench/publish_preview.py --check
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --cwd sites/twig.leostera.dev --frozen-lockfile
      - run: bun run --cwd sites/twig.leostera.dev typecheck
      - run: bun run --cwd sites/twig.leostera.dev test
      - run: bun run --cwd sites/twig.leostera.dev build
  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            filesystem: apfs
          - os: ubuntu-latest
            filesystem: xfs
          - os: ubuntu-latest
            filesystem: btrfs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all --check
      - run: cargo run -p twig-bench --bin twig-readme-table --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Prepare reflink-capable Linux test filesystem
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs btrfs-progs
          image="$RUNNER_TEMP/twig-${{ matrix.filesystem }}.img"
          truncate -s 1G "$image"
          if [ "${{ matrix.filesystem }}" = xfs ]; then
            mkfs.xfs -m reflink=1 "$image"
          else
            mkfs.btrfs "$image"
          fi
          mkdir -p target/test-fixtures
          sudo mount -o loop "$image" target/test-fixtures
          sudo chown "$(id -u):$(id -g)" target/test-fixtures
      - name: Independently probe Linux adoption primitives
        if: runner.os == 'Linux'
        run: python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py target/test-fixtures --github-env
      - name: Require native Linux reflinks
        if: runner.os == 'Linux'
        env:
          TWIG_TEST_REQUIRE_NATIVE: '1'
        run: cargo test -p git-twig --locked
      - name: Verify native in-place adoption, including open mappings and stale comparisons
        if: runner.os == 'Linux'
        env:
          TWIG_TEST_REQUIRE_NATIVE: '1'
        run: cargo test -p git-twig --locked adopt -- --include-ignored
      - run: cargo build --workspace --release --locked
  windows:
    # Git for Windows' defaults convert line endings; check out the bytes as
    # committed, as on the other runners.
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all --check
      - run: cargo run -p twig-bench --bin twig-readme-table --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test on NTFS, where Twig delegates to stock Git
        run: cargo test --workspace --locked
      - name: Create a ReFS Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 4GB
          drive-format: ReFS
      - name: Require native block cloning on the Dev Drive
        shell: pwsh
        env:
          TWIG_TEST_REQUIRE_NATIVE: '1'
          # Runners are elevated, so cases may create folder-mounted Dev Drives.
          TWIG_TEST_WINDOWS_VHDX: '1'
        run: |
          $env:TWIG_TEST_FIXTURE_ROOT = "$($env:DEV_DRIVE)/twig-fixtures"
          cargo test -p git-twig --locked
      - run: cargo build --workspace --release --locked
  minimum-git:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: git/git
          ref: v2.40.0
          path: .git-minimum
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build minimum supported Git
        run: |
          # Git 2.40 predates C23: GCC 15 otherwise clashes with its unreachable() helper.
          make -C .git-minimum -j4 CFLAGS="-O2 -std=gnu99" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease \
            prefix="$RUNNER_TEMP/git-minimum" install
          echo "$RUNNER_TEMP/git-minimum/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: cargo test --workspace --locked
  overlay-filesystems:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backing: [ext4, xfs, btrfs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: Prepare isolated backing filesystem and lower fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs xfsprogs btrfs-progs
          root="$RUNNER_TEMP/overlay-lab"
          mkdir "$root"
          truncate -s 1G "$root/backing.img"
          case '${{ matrix.backing }}' in
            ext4) mkfs.ext4 -q "$root/backing.img" ;;
            xfs) mkfs.xfs -q -m reflink=1 "$root/backing.img" ;;
            btrfs) mkfs.btrfs -q "$root/backing.img" ;;
          esac
          mkdir "$root/backing"
          sudo mount -o loop "$root/backing.img" "$root/backing"
          sudo chown "$(id -u):$(id -g)" "$root/backing"
          mkdir "$root/backing/"{lower,upper,work,merged}
          target/debug/twig-overlay-fixture "$root/backing/lower/case"
          sudo mount -t overlay overlay -o "lowerdir=$root/backing/lower,upperdir=$root/backing/upper,workdir=$root/backing/work" "$root/backing/merged"
      - name: Check backing filesystem and fresh upper-layer checkouts
        run: |
          root="$RUNNER_TEMP/overlay-lab/backing"
          if [ '${{ matrix.backing }}' != ext4 ]; then
            export TWIG_TEST_REQUIRE_NATIVE=1
          fi
          TWIG_TEST_DEDUPE_SUPPORTED=$(python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py "$root" | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["dedupeSupported"]))')
          export TWIG_TEST_DEDUPE_SUPPORTED
          TWIG_TEST_FIXTURE_ROOT="$root/plain-fixtures" cargo test -p git-twig --locked
          TWIG_TEST_DEDUPE_SUPPORTED=$(python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py "$root/merged" | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["dedupeSupported"]))')
          export TWIG_TEST_DEDUPE_SUPPORTED
          TWIG_TEST_FIXTURE_ROOT="$root/merged/upper-fixtures" cargo test -p git-twig --locked
      - name: Check lower-layer copy-up, private writes and source preservation
        env:
          TWIG_TEST_OVERLAY_LOWER_CASE: ${{ runner.temp }}/overlay-lab/backing/merged/case
          TWIG_TEST_OVERLAY_LOWER_ORACLE: ${{ runner.temp }}/overlay-lab/backing/lower/case
        run: |
          if [ '${{ matrix.backing }}' != ext4 ]; then
            export TWIG_TEST_REQUIRE_NATIVE=1
          fi
          cargo test -p git-twig --test worktrees --locked -- \
            --exact filesystem_coverage::overlay_lower_layer_checkout_matches_git_without_mutating_lower_inputs
      - name: Verify lower-layer adoption and kernel refusals
        run: |
          root="$RUNNER_TEMP/overlay-lab/backing"
          capability=$(python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py "$root/merged")
          executable=$(printf '%s' "$capability" | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifacts"] + "/dedupe-probe")')
          TWIG_TEST_CLONE_SUPPORTED=$(printf '%s' "$capability" | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["cloneSupported"]))')
          export TWIG_TEST_CLONE_SUPPORTED
          layout=$(python3 crates/git-twig/tests/fixtures/prepare-adoption-overlay.py "$root")
          TWIG_TEST_ADOPT_OVERLAY_CASE=$(printf '%s' "$layout" | python3 -c 'import json,sys; print(json.load(sys.stdin)["case"])')
          export TWIG_TEST_ADOPT_OVERLAY_CASE
          trap 'sudo umount "$TWIG_TEST_ADOPT_OVERLAY_CASE"' EXIT
          TWIG_TEST_ADOPT_OVERLAY_ORACLE=$(printf '%s' "$layout" | python3 -c 'import json,sys; print(json.load(sys.stdin)["oracle"])')
          export TWIG_TEST_ADOPT_OVERLAY_ORACLE
          TWIG_TEST_DEDUPE_SUPPORTED=$("$executable" "$TWIG_TEST_ADOPT_OVERLAY_CASE/probe" --existing | python3 -c 'import json,sys; print(int(json.load(sys.stdin)["supported"]))')
          export TWIG_TEST_DEDUPE_SUPPORTED
          cargo test -p git-twig --test worktrees --locked overlay_lower_layer_adoption
      - name: Unmount owned filesystems
        if: always()
        run: |
          root="$RUNNER_TEMP/overlay-lab/backing"
          if mountpoint -q "$root/merged"; then sudo umount "$root/merged"; fi
          if mountpoint -q "$root"; then sudo umount "$root"; fi
  ntfs-filesystems:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver: [ntfs3, ntfs-3g]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare isolated NTFS image
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g
          root="$RUNNER_TEMP/ntfs-lab"
          mkdir "$root"
          truncate -s 1G "$root/volume.img"
          mkfs.ntfs -F -Q -L TwigTest "$root/volume.img"
          mkdir "$root/mount"
          if [ '${{ matrix.driver }}' = ntfs3 ]; then
            sudo mount -t ntfs3 -o "loop,uid=$(id -u),gid=$(id -g),acl" "$root/volume.img" "$root/mount"
          else
            sudo ntfs-3g "$root/volume.img" "$root/mount" -o permissions,allow_other
            sudo chown "$(id -u):$(id -g)" "$root/mount"
          fi
      - name: Independently probe NTFS adoption capabilities
        run: python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py "$RUNNER_TEMP/ntfs-lab/mount" --github-env
      - name: Verify checkout and filesystem-restricted pathname behavior
        env:
          TWIG_TEST_FIXTURE_ROOT: ${{ runner.temp }}/ntfs-lab/mount/fixtures
        run: cargo test -p git-twig --locked
      - name: Unmount owned NTFS image
        if: always()
        run: |
          root="$RUNNER_TEMP/ntfs-lab"
          if mountpoint -q "$root/mount"; then sudo umount "$root/mount"; fi
  portable-filesystems:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        filesystem: [tmpfs, exfat, vfat]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare bounded owned filesystem
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs dosfstools
          root="$RUNNER_TEMP/portable-lab"
          mkdir "$root"
          mkdir "$root/mount" "$root/other"
          if [ '${{ matrix.filesystem }}' = tmpfs ]; then
            sudo mount -t tmpfs -o "size=512M,uid=$(id -u),gid=$(id -g),nodev,nosuid" tmpfs "$root/mount"
          else
            truncate -s 1G "$root/volume.img"
            if [ '${{ matrix.filesystem }}' = exfat ]; then
              mkfs.exfat "$root/volume.img"
            else
              mkfs.vfat -F 32 "$root/volume.img"
            fi
            sudo mount -t '${{ matrix.filesystem }}' -o "loop,uid=$(id -u),gid=$(id -g),umask=022" "$root/volume.img" "$root/mount"
          fi
      - name: Independently probe portable adoption capabilities
        run: python3 crates/git-twig/tests/fixtures/probe-linux-adoption.py "$RUNNER_TEMP/portable-lab/mount" --github-env
      - name: Check appropriate filesystem contract
        env:
          TWIG_TEST_FIXTURE_ROOT: ${{ runner.temp }}/portable-lab/mount/fixtures
        run: |
          if [ '${{ matrix.filesystem }}' = tmpfs ]; then
            TWIG_TEST_CROSS_FILESYSTEM_ROOT="$RUNNER_TEMP/portable-lab/other" cargo test -p git-twig --locked
          else
            cargo test -p git-twig --test worktrees --locked adopt::linux::
            cargo test -p git-twig --test worktrees --locked filesystem_coverage::portable_
            cargo test -p git-twig --test worktrees --locked raw_byte_paths_match_git_or_its_filesystem_rejection
            cargo test -p git-twig --test worktrees --locked empty_large_and_sparse_files_have_private_writes
          fi
      - name: Unmount owned filesystem
        if: always()
        run: |
          root="$RUNNER_TEMP/portable-lab"
          if mountpoint -q "$root/mount"; then sudo umount "$root/mount"; fi
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --locked
